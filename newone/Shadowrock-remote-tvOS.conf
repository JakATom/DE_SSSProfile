####
## bypass-system默认为true。网路解释：旁路系统（bypass-system）：如果禁用此选项，可能会导致一些系统问题，如推送通知延迟。
## 实际测试，bypass-system设置为false后，shadowrocket会经常启动不了，反复重启。
bypass-system = true
